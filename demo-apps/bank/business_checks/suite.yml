# Approved business invariants. Generated by SemantiCI; run by the CI release gate.
workflows:
- name: money-transfer
  description: Two customers send money to each other.
  steps:
  - method: GET
    path: /accounts
    expect_status: 200
  - method: POST
    path: /transfer
    json:
      from_account: 1
      to_account: 2
      amount: 2500
    expect_status: 200
  - method: POST
    path: /transfer
    json:
      from_account: 2
      to_account: 3
      amount: 1000
    expect_status: 200
- name: transfer-above-balance
  description: A customer tries to send more money than the account holds.
  steps:
  - method: POST
    path: /transfer
    json:
      from_account: 3
      to_account: 1
      amount: 50000
    expect_status:
    - 200
    - 400
invariants:
- key: account-balance-equals-ledger-sum
  description: An account's current balance must equal its opening balance plus the sum of all its ledger
    entry deltas.
  severity: critical
  check_sql: SELECT a.id, a.balance, a.opening_balance, COALESCE(SUM(l.delta), 0) AS calculated_delta
    FROM accounts a LEFT JOIN ledger_entries l ON a.id = l.account_id GROUP BY a.id HAVING a.balance !=
    (a.opening_balance + COALESCE(SUM(l.delta), 0))
  gwt:
    given: Accounts exist with opening balances and recorded ledger entries
    when: Any transfer or financial transaction occurs
    then: Each account balance must equal opening_balance + sum of ledger deltas
- key: total-system-balance-conserved
  description: The sum of all account balances across the system must equal the sum of all opening balances.
  severity: critical
  check_sql: SELECT SUM(balance) AS total_balance, SUM(opening_balance) AS total_opening FROM accounts
    HAVING SUM(balance) != SUM(opening_balance)
  gwt:
    given: A bank system with initial opening balances
    when: Transfers occur between accounts
    then: The total money across all accounts must remain invariant
- key: no-negative-account-balances
  description: Account balances must not drop below zero.
  severity: critical
  check_sql: SELECT id, owner, balance FROM accounts WHERE balance < 0
  gwt:
    given: An account with a positive balance
    when: A transfer request is processed
    then: The transaction must be rejected if it would cause the sender's balance to become negative
- key: completed-transfer-ledger-zero-sum
  description: The sum of ledger entry deltas for any transfer must equal zero.
  severity: high
  check_sql: SELECT transfer_id, SUM(delta) AS net_delta FROM ledger_entries GROUP BY transfer_id HAVING
    SUM(delta) != 0
  gwt:
    given: A transfer between two accounts
    when: The transfer completes
    then: The debited amount must exactly equal the credited amount across ledger entries
- key: completed-transfer-entry-count
  description: Every completed transfer must have exactly two ledger entries (one debit and one credit).
  severity: high
  check_sql: SELECT t.id, COUNT(l.id) AS entry_count FROM transfers t LEFT JOIN ledger_entries l ON t.id
    = l.transfer_id WHERE t.status = 'COMPLETED' GROUP BY t.id HAVING COUNT(l.id) != 2
  gwt:
    given: A transfer is created
    when: The transfer status is set to COMPLETED
    then: Exactly two ledger entries (one debit, one credit) must be recorded
- key: ledger-delta-matches-transfer-amount
  description: The magnitude of each ledger entry delta must match the transfer amount.
  severity: high
  check_sql: SELECT l.id, l.transfer_id, l.delta, t.amount FROM ledger_entries l JOIN transfers t ON l.transfer_id
    = t.id WHERE ABS(l.delta) != t.amount
  gwt:
    given: A transfer with a specified amount
    when: Ledger entries are created for the transfer
    then: The absolute value of delta in each entry must equal the transfer amount
