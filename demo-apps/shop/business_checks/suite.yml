# Approved business invariants. Generated by SemantiCI; run by the CI release gate.
workflows:
- name: checkout
  description: A customer adds products to the cart, checks out and pays.
  steps:
  - method: GET
    path: /products
    expect_status: 200
  - method: POST
    path: /cart
    json:
      user_id: 1
      product_id: 1
      qty: 1
    expect_status: 200
  - method: POST
    path: /cart
    json:
      user_id: 1
      product_id: 3
      qty: 2
    expect_status: 200
  - method: POST
    path: /checkout
    json:
      user_id: 1
    expect_status: 200
- name: second-customer-checkout
  description: A different customer buys a single product.
  steps:
  - method: POST
    path: /cart
    json:
      user_id: 2
      product_id: 2
      qty: 3
    expect_status: 200
  - method: POST
    path: /checkout
    json:
      user_id: 2
    expect_status: 200
invariants:
- key: successful-payment-has-order
  description: Every successful payment must be linked to exactly one order.
  severity: critical
  check_sql: SELECT p.id FROM payments p WHERE p.status = 'SUCCESS' AND NOT EXISTS (SELECT 1 FROM orders
    o WHERE o.payment_id = p.id)
  gwt:
    given: A successful payment has been processed
    when: An order is skipped due to a bug
    then: The invariant check should return the orphaned payment record
- key: order-total-matches-items
  description: The total amount of an order must equal the sum of (qty * price) for all its order items.
  severity: critical
  check_sql: SELECT o.id FROM orders o JOIN (SELECT order_id, SUM(qty * price) as calculated_total FROM
    order_items GROUP BY order_id) i ON o.id = i.order_id WHERE o.total <> i.calculated_total
  gwt:
    given: An order has been created with associated items
    when: The sum of order items does not match the order total header
    then: The order id is returned as violating
- key: payment-amount-matches-order
  description: The payment amount must exactly match the total of the associated order.
  severity: critical
  check_sql: SELECT p.id FROM payments p JOIN orders o ON o.payment_id = p.id WHERE p.amount <> o.total
  gwt:
    given: A payment and an order are linked
    when: Their monetary amounts diverge
    then: The payment record is flagged as violating
- key: stock-non-negative
  description: Product stock must never drop below zero.
  severity: critical
  check_sql: SELECT id FROM products WHERE stock < 0
  gwt:
    given: A product has limited stock
    when: More items are ordered than available stock
    then: Stock becomes negative and violates the invariant
- key: no-double-charging
  description: Each checkout reference must not result in multiple successful payment records for the
    same transaction.
  severity: high
  check_sql: SELECT checkout_ref FROM payments GROUP BY checkout_ref HAVING COUNT(*) > 1
  gwt:
    given: A checkout transaction is performed
    when: A double charge bug duplicates the payment record for the same checkout reference
    then: The duplicated checkout reference is returned
- key: stock-conservation
  description: Current stock plus total sold quantity via order items must equal initial stock for every
    product.
  severity: high
  check_sql: SELECT p.id FROM products p LEFT JOIN (SELECT product_id, SUM(qty) as sold FROM order_items
    GROUP BY product_id) i ON p.id = i.product_id WHERE p.initial_stock <> (p.stock + COALESCE(i.sold,
    0))
  gwt:
    given: Products have initial stock and have been sold
    when: Stock updates fail during checkout
    then: The stock conservation check fails and returns the product id
