# Approved business invariants. Generated by SemantiCI; run by the CI release gate.
workflows:
- name: checkout
  description: A customer adds products to the cart, checks out and pays.
  steps:
  - method: GET
    path: /products
    expect_status: 200
  - method: POST
    path: /cart
    json:
      user_id: 1
      product_id: 1
      qty: 1
    expect_status: 200
  - method: POST
    path: /cart
    json:
      user_id: 1
      product_id: 3
      qty: 2
    expect_status: 200
  - method: POST
    path: /checkout
    json:
      user_id: 1
    expect_status: 200
- name: second-customer-checkout
  description: A different customer buys a single product.
  steps:
  - method: POST
    path: /cart
    json:
      user_id: 2
      product_id: 2
      qty: 3
    expect_status: 200
  - method: POST
    path: /checkout
    json:
      user_id: 2
    expect_status: 200
invariants:
- key: cart-items-product-id-references-existing-products
  description: Every cart_items record must reference an existing products record.
  severity: high
  check_sql: SELECT c.* FROM cart_items c LEFT JOIN products p ON p.id = c.product_id WHERE c.product_id
    IS NOT NULL AND p.id IS NULL
  gwt:
    given: a cart_items record exists
    when: the transaction completes
    then: the products record it references must exist
- key: cart-items-user-id-references-existing-users
  description: Every cart_items record must reference an existing users record.
  severity: high
  check_sql: SELECT c.* FROM cart_items c LEFT JOIN users p ON p.id = c.user_id WHERE c.user_id IS NOT
    NULL AND p.id IS NULL
  gwt:
    given: a cart_items record exists
    when: the transaction completes
    then: the users record it references must exist
- key: cart-items-qty-not-negative
  description: cart_items.qty must never be negative.
  severity: medium
  check_sql: SELECT * FROM cart_items WHERE qty < 0
  gwt:
    given: any cart_items record
    when: the transaction completes
    then: its qty must not be negative
- key: order-items-product-id-references-existing-products
  description: Every order_items record must reference an existing products record.
  severity: high
  check_sql: SELECT c.* FROM order_items c LEFT JOIN products p ON p.id = c.product_id WHERE c.product_id
    IS NOT NULL AND p.id IS NULL
  gwt:
    given: a order_items record exists
    when: the transaction completes
    then: the products record it references must exist
- key: order-items-order-id-references-existing-orders
  description: Every order_items record must reference an existing orders record.
  severity: high
  check_sql: SELECT c.* FROM order_items c LEFT JOIN orders p ON p.id = c.order_id WHERE c.order_id IS
    NOT NULL AND p.id IS NULL
  gwt:
    given: a order_items record exists
    when: the transaction completes
    then: the orders record it references must exist
- key: successful-orders-has-order-items
  description: Every successful orders record must have at least one corresponding order_items record.
  severity: critical
  check_sql: SELECT p.*, COUNT(c.order_id) AS order_items_found FROM orders p LEFT JOIN order_items c
    ON c.order_id = p.id WHERE UPPER(p.status) IN ('SUCCESS', 'SUCCEEDED', 'PAID', 'COMPLETED', 'CONFIRMED',
    'APPROVED') GROUP BY p.id HAVING COUNT(c.order_id) < 1
  gwt:
    given: a orders record is successful
    when: the transaction completes
    then: at least one corresponding order_items record must exist
- key: order-items-qty-not-negative
  description: order_items.qty must never be negative.
  severity: medium
  check_sql: SELECT * FROM order_items WHERE qty < 0
  gwt:
    given: any order_items record
    when: the transaction completes
    then: its qty must not be negative
- key: order-items-price-not-negative
  description: order_items.price must never be negative.
  severity: medium
  check_sql: SELECT * FROM order_items WHERE price < 0
  gwt:
    given: any order_items record
    when: the transaction completes
    then: its price must not be negative
- key: orders-payment-id-references-existing-payments
  description: Every orders record must reference an existing payments record.
  severity: high
  check_sql: SELECT c.* FROM orders c LEFT JOIN payments p ON p.id = c.payment_id WHERE c.payment_id IS
    NOT NULL AND p.id IS NULL
  gwt:
    given: a orders record exists
    when: the transaction completes
    then: the payments record it references must exist
- key: successful-payments-has-orders
  description: Every successful payments record must have exactly one corresponding orders record.
  severity: critical
  check_sql: SELECT p.*, COUNT(c.payment_id) AS orders_found FROM payments p LEFT JOIN orders c ON c.payment_id
    = p.id WHERE UPPER(p.status) IN ('SUCCESS', 'SUCCEEDED', 'PAID', 'COMPLETED', 'CONFIRMED', 'APPROVED')
    GROUP BY p.id HAVING COUNT(c.payment_id) <> 1
  gwt:
    given: a payments record is successful
    when: the transaction completes
    then: exactly one corresponding orders record must exist
- key: orders-user-id-references-existing-users
  description: Every orders record must reference an existing users record.
  severity: high
  check_sql: SELECT c.* FROM orders c LEFT JOIN users p ON p.id = c.user_id WHERE c.user_id IS NOT NULL
    AND p.id IS NULL
  gwt:
    given: a orders record exists
    when: the transaction completes
    then: the users record it references must exist
- key: orders-total-not-negative
  description: orders.total must never be negative.
  severity: medium
  check_sql: SELECT * FROM orders WHERE total < 0
  gwt:
    given: any orders record
    when: the transaction completes
    then: its total must not be negative
- key: payments-user-id-references-existing-users
  description: Every payments record must reference an existing users record.
  severity: high
  check_sql: SELECT c.* FROM payments c LEFT JOIN users p ON p.id = c.user_id WHERE c.user_id IS NOT NULL
    AND p.id IS NULL
  gwt:
    given: a payments record exists
    when: the transaction completes
    then: the users record it references must exist
- key: payments-amount-not-negative
  description: payments.amount must never be negative.
  severity: medium
  check_sql: SELECT * FROM payments WHERE amount < 0
  gwt:
    given: any payments record
    when: the transaction completes
    then: its amount must not be negative
- key: products-price-not-negative
  description: products.price must never be negative.
  severity: medium
  check_sql: SELECT * FROM products WHERE price < 0
  gwt:
    given: any products record
    when: the transaction completes
    then: its price must not be negative
- key: products-stock-not-negative
  description: products.stock must never be negative.
  severity: medium
  check_sql: SELECT * FROM products WHERE stock < 0
  gwt:
    given: any products record
    when: the transaction completes
    then: its stock must not be negative
- key: product-stock-must-equal-initial-stock-minus-the-units-sold
  description: Product stock must equal initial stock minus the units sold.
  severity: critical
  check_sql: SELECT p.id, p.name, p.initial_stock, p.stock, COALESCE(SUM(oi.qty),0) AS units_sold FROM
    products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id HAVING p.stock <> p.initial_stock
    - COALESCE(SUM(oi.qty),0)
  gwt:
    given: the business scenario has been executed
    when: the transaction completes
    then: Product stock must equal initial stock minus the units sold.
- key: one-checkout-must-not-produce-more-than-one-successful-payment
  description: One checkout must not produce more than one successful payment.
  severity: critical
  check_sql: SELECT checkout_ref, COUNT(*) AS successful_payments, SUM(amount) AS total_charged FROM payments
    WHERE status = 'SUCCESS' GROUP BY checkout_ref HAVING COUNT(*) > 1
  gwt:
    given: the business scenario has been executed
    when: the transaction completes
    then: One checkout must not produce more than one successful payment.
